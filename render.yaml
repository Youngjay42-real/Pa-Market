# Render Blueprint — PaMarket (frontend + backend from one repo)
# Docs: https://render.com/docs/blueprint-spec
#
# Database: Neon PostgreSQL (NOT created here — passed via DATABASE_URL env var)
# Payments: DevDraft credentials via environment (never committed)

services:
  # ── Flask backend ─────────────────────────────────────────────────────────
  - type: web
    name: pamarket-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: python -m venv .venv && .venv/bin/pip install --upgrade pip && .venv/bin/pip install -r requirements.txt && FLASK_APP=wsgi.py .venv/bin/flask db upgrade
    startCommand: FLASK_APP=wsgi.py .venv/bin/flask bootstrap-admin && .venv/bin/gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: FLASK_ENV
        value: production
      # Neon pooled connection string (set via dashboard, not committed here)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: "https://pamarket-frontend.onrender.com,http://localhost:3000"
      # ── DevDraft ──
      - key: DEVDRAFT_MODE
        value: "test" # sandbox | test | live
      - key: DEVDRAFT_CLIENT_KEY
        sync: false
      - key: DEVDRAFT_CLIENT_SECRET
        sync: false
      - key: DEVDRAFT_WEBHOOK_SECRET
        sync: false
      - key: DEVDRAFT_WEBHOOK_URL
        value: "https://pamarket-backend.onrender.com/api/v1/payments/webhook/devdraft"
      # ── Hackathon money-safety limits (server-enforced) ──
      - key: PAYMENT_MAX_PER_TRANSACTION
        value: "5.00"
      - key: PAYMENT_MAX_TEAM_TOTAL
        value: "50.00"
      - key: DEFAULT_STAND_FEE
        value: "5.00"
      - key: ALLOW_DEMO_SEED
        value: "false"
      # A single admin account is provisioned without demo vendors or stands.
      # Render generates and stores the initial password as a private secret.
      - key: ADMIN_BOOTSTRAP_PHONE
        value: "0776596009"
      - key: ADMIN_BOOTSTRAP_NAME
        value: "Council Administrator"
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      # ── Market Assistant (chatbot) ──
      # Empty CHATBOT_DATABASE_URL = chat tables live in the same Neon database.
      - key: CHATBOT_DATABASE_URL
        sync: false
      - key: CHATBOT_SECRET_KEY
        generateValue: true
      # "mock" = labelled deterministic assistant (no LLM key needed for the demo).
      # Hackathon decision: NVIDIA NIM (ChatbotLLM) — set CHATBOT_LLM_API_KEY
      # (nvapi-… from build.nvidia.com) and optionally CHATBOT_LLM_MODEL.
      - key: CHATBOT_LLM_PROVIDER
        value: "nvidia_nim"
      - key: CHATBOT_LLM_API_KEY
        sync: false
      - key: CHATBOT_LLM_MODEL
        sync: false
      - key: CHATBOT_LLM_BASE_URL
        sync: false

# ── Next.js frontend ────────────────────────────────────────────────────────
  - type: web
    name: pamarket-frontend
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      # Use the frontend's same-origin /api/v1 rewrite to Flask.
      - key: NEXT_PUBLIC_API_URL
        value: "/api/v1"
      # Market Assistant widget on; FLASK_API_URL is the rewrite destination.
      - key: NEXT_PUBLIC_CHATBOT_ENABLED
        value: "true"
      - key: FLASK_API_URL
        value: "https://pamarket-backend.onrender.com"
